<!DOCTYPE html>
<html lang="fr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>REVALIXX | HARD TECHNO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Ajout de Michroma pour le style large et carré -->
    <link href="https://fonts.googleapis.com/css2?family=Michroma&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Rajdhani', sans-serif;
        background-color: #000;
        color: #fff;
        overflow-x: hidden;
      }
      /* Remplacement par Michroma pour le style NO COMPROMISE */
      h1, h2, h3, .brand-font {
        font-family: 'Michroma', sans-serif;
        letter-spacing: 0.05em; /* Michroma est déjà large */
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0a0a0a;
      }
      ::-webkit-scrollbar-thumb {
        background: #333;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #dc2626;
      }
      .neon-text {
        text-shadow: 0 0 10px rgba(220, 38, 38, 0.7), 0 0 20px rgba(220, 38, 38, 0.5);
      }
      .chaos-bg {
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
      }
      
      /* Slow Aura Pulse */
      @keyframes aura-pulse {
        0% { transform: translate(-50%, -50%) scale(1); opacity: 0.3; }
        50% { transform: translate(-50%, -50%) scale(1.15); opacity: 0.6; }
        100% { transform: translate(-50%, -50%) scale(1); opacity: 0.3; }
      }
      .animate-aura-pulse {
        animation: aura-pulse 6s infinite ease-in-out;
      }

      /* Deep Breathing Background Aura */
      @keyframes breathe {
        0% { transform: translate(-50%, -50%) scale(1); opacity: 0.15; }
        50% { transform: translate(-50%, -50%) scale(1.1); opacity: 0.3; }
        100% { transform: translate(-50%, -50%) scale(1); opacity: 0.15; }
      }
      .animate-breathe {
        animation: breathe 8s infinite ease-in-out;
      }

      /* Scanline Animation */
      @keyframes scan {
        0% { top: -10%; opacity: 0; }
        10% { opacity: 0.2; }
        90% { opacity: 0.2; }
        100% { top: 110%; opacity: 0; }
      }
      .scanline {
        position: fixed;
        left: 0;
        width: 100%;
        height: 2px;
        background: rgba(220, 38, 38, 0.4);
        box-shadow: 0 0 5px rgba(220, 38, 38, 0.3);
        z-index: 9999;
        pointer-events: none;
        animation: scan 12s linear infinite;
        opacity: 0.15;
      }

      /* Dying Light Effect - MODIFIÉ : Ne descend jamais trop bas en opacité */
      @keyframes dying-light {
        0% { opacity: 1; filter: brightness(1.2) contrast(1.2); }
        
        /* Petit saut de tension */
        5% { opacity: 0.8; filter: brightness(0.9); }
        6% { opacity: 1; filter: brightness(1.2) contrast(1.2); }
        
        /* Baisse légère */
        25% { opacity: 1; filter: brightness(1.2); }
        26% { opacity: 0.7; filter: brightness(0.8); } 
        27% { opacity: 1; filter: brightness(1.2); }

        /* Stable */
        50% { opacity: 1; filter: brightness(1.2); }
        
        /* Double clignotement rapide mais visible */
        70% { opacity: 0.8; filter: brightness(0.9); }
        71% { opacity: 1; filter: brightness(1.3); }
        72% { opacity: 0.7; filter: brightness(0.8); }
        73% { opacity: 1; filter: brightness(1.2); }

        100% { opacity: 1; filter: brightness(1.2) contrast(1.2); }
      }
      
      .animate-dying-light {
        /* Animation plus lente et aléatoire pour faire naturel */
        animation: dying-light 5s infinite steps(1, start);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "@google/genai": "https://esm.sh/@google/genai@^1.41.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.571.0"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
  </body>
</html>
