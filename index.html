    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Michroma&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Rajdhani', sans-serif;
        background-color: #000;
        color: #fff;
        overflow-x: hidden;
      }
      h1, h2, h3, .brand-font {
        font-family: 'Michroma', sans-serif;
        letter-spacing: 0.05em;
      }
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: #0a0a0a; }
      ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #dc2626; }
      .neon-text { text-shadow: 0 0 10px rgba(220, 38, 38, 0.7), 0 0 20px rgba(220, 38, 38, 0.5); }
      
      @keyframes aura-pulse {
        0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.3; }
        50% { transform: translate(-50%, -50%) scale(1.1); opacity: 0.5; }
        100% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.3; }
      }
      .animate-aura-pulse { animation: aura-pulse 7s infinite ease-in-out; }

      @keyframes breathe {
        0% { transform: translate(-50%, -50%) scale(1); opacity: 0.2; }
        50% { transform: translate(-50%, -50%) scale(1.05); opacity: 0.4; }
        100% { transform: translate(-50%, -50%) scale(1); opacity: 0.2; }
      }
      .animate-breathe { animation: breathe 9s infinite ease-in-out; }

      @keyframes scan {
        0% { top: -10%; opacity: 0; }
        10% { opacity: 0.2; }
        90% { opacity: 0.2; }
        100% { top: 110%; opacity: 0; }
      }
      .scanline {
        position: fixed; left: 0; width: 100%; height: 2px;
        background: rgba(220, 38, 38, 0.4); z-index: 9999;
        pointer-events: none; animation: scan 12s linear infinite; opacity: 0.15;
      }

      @keyframes dying-light {
        0%, 100% { opacity: 1; filter: brightness(1.1); }
        25%, 70% { opacity: 0.9; }
        26%, 71% { opacity: 1; filter: brightness(1.2); }
      }
      .animate-dying-light { animation: dying-light 5s infinite steps(1); }
    </style>
